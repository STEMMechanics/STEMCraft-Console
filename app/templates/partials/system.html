<div class="system-page" data-page-title="System">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-heading"><span>CPU</span><strong id="cpu-value">0%</strong></div><div class="progress"><div id="cpu-bar" class="progress-bar"></div></div><div id="cpu-detail" class="stat-detail">Loading...</div></div>
    <div class="stat-card"><div class="stat-heading"><span>Memory</span><strong id="memory-value">0%</strong></div><div class="progress"><div id="memory-bar" class="progress-bar"></div></div><div id="memory-detail" class="stat-detail">Loading...</div></div>
    <div class="stat-card"><div class="stat-heading"><span>Storage</span><strong id="storage-value">0%</strong></div><div class="progress"><div id="storage-bar" class="progress-bar"></div></div><div id="storage-detail" class="stat-detail">Loading...</div></div>
    <div class="stat-card"><div class="stat-heading"><span>Minecraft</span><strong id="minecraft-running">-</strong></div><div id="minecraft-installed" class="stat-detail">Loading...</div></div>
    <div class="stat-card"><div class="stat-heading"><span>Players Online</span><strong id="minecraft-players">-</strong></div><div class="stat-detail">Across accessible servers</div></div>
  </div>
  <section class="overview-card system-instances-card">
    <div class="card-header"><span>Installed Java Runtimes</span></div>
    <div id="system-java-list" class="system-instance-list"><div class="empty-message">Loading Java runtimes...</div></div>
  </section>
  <section class="overview-card system-instances-card">
    <div class="card-header"><span>Minecraft Instances</span></div>
    <div id="system-instance-list" class="system-instance-list"><div class="empty-message">Loading servers...</div></div>
  </section>
</div>
