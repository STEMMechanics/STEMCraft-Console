<div class="file-editor-page" data-server-id="{{ server.id }}" data-page-title="Edit File">

    <div class="file-editor-toolbar">

        <div>

            <strong>
                {{ filename }}
            </strong>

            <small>
                {{ server.name }} · {{ file_path }}
            </small>

        </div>


        <a
            href="/servers/{{ server.id }}/files?path={{ parent_path }}"
            class="button"
        >
            Back to Files
        </a>

    </div>


    <form
        method="post"
        action="/servers/{{ server.id }}/files/edit"
    >

        <input
            type="hidden"
            name="path"
            value="{{ file_path }}"
        >

        <input type="hidden" name="confirm_unknown" value="{{ 'true' if confirm_unknown else 'false' }}">

        <textarea
            name="contents"
            class="file-editor"
            spellcheck="false"
        >{{ contents }}</textarea>


        <div class="file-editor-actions">

            <button class="button" type="submit" name="close" value="false">
                Save
            </button>

            <button class="button" type="submit" name="close" value="true">
                Save and Close
            </button>

        </div>

    </form>

</div>
