<div class="advanced-properties-page" data-server-id="{{ server.id }}" data-page-title="Advanced Properties">
    <section class="overview-card property-section advanced-properties-section">
        <div class="card-header">
            <div>
                <span>Advanced YAML Configuration</span>
                <small>Paper, Bukkit, Spigot and per-world settings detected for this server</small>
            </div>
            <a class="button" href="/servers/{{ server.id }}/properties"
               hx-get="/servers/{{ server.id }}/properties"
               hx-target="#page-content" hx-push-url="true">Back to Properties</a>
        </div>
        <div class="advanced-properties-intro">
            Settings are grouped by configuration family and reflect the files generated by this Paper version. Invalid YAML is rejected before saving.
        </div>
        <div id="advanced-properties-groups" class="advanced-properties-groups">
            <div class="empty-message">Loading advanced configuration files...</div>
        </div>
    </section>
</div>
