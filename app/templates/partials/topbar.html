<div class="topbar" data-server-id="{{ active_server.id if active_server else '' }}">

    <button class="mobile-menu-toggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false" onclick="toggleMobileSidebar()">
        <i class="fa-solid fa-bars"></i>
    </button>

    <h1 id="topbar-title">
        {{ page_title or "Overview" }}
    </h1>

    {% if active_server %}

    <div class="topbar-actions">

        <div class="topbar-status">

            <span id="topbar-status-dot" class="server-dot"></span>

            <span id="topbar-status-text">
                Checking...
            </span>

            <span class="topbar-version">
                · Paper
                {{ active_server.minecraft_version or "" }}
            </span>

        </div>

        {% if user.can("servers.control") %}
        <button id="topbar-start" class="button start" onclick="serverAction('start')" style="display:none">
            Start
        </button>

        <button id="topbar-restart" class="button" onclick="serverAction('restart')">
            Restart
        </button>

        <button id="topbar-stop" class="button danger" onclick="serverAction('stop')">
            Stop
        </button>
        {% endif %}


    </div>

    {% endif %}

</div>
