<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | STEMCraft Console</title>

    <link rel="stylesheet" href="/static/style.css?v=20260809-5">
</head>

<body class="login-body">

    <div class="login-shell">

        <div class="login-logo-wrap">

            <img src="/static/images/logo.svg" alt="STEMMechanics" class="login-logo">

        </div>


        <div class="login-card">

            <h1>Welcome back</h1>

            <p>
                Sign in to manage your Minecraft servers.
            </p>


            {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

            {% endif %}


            <form method="post" action="/login">

                <label class="login-field">

                    <span>Username</span>

                    <input type="text" name="username" autocomplete="username" autofocus required>

                </label>


                <label class="login-field">

                    <span>Password</span>

                    <input type="password" name="password" autocomplete="current-password" required>

                </label>


                <button type="submit" class="login-button">
                    Sign In
                </button>

            </form>

            <div class="login-help">

                <a href="/forgot-password">
                    Forgot password?
                </a>

            </div>

        </div>

    </div>

    <div class="login-version">
        v{{ app_version }}
    </div>
    <script src="/static/form_feedback.js?v=20260809-1"></script>
</body>

</html>
