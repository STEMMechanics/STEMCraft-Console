<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}STEMCraft Console{% endblock %}
    </title>

    <link rel="stylesheet" href="/static/style.css?v=20260809-13">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>

<body>

    <div class="app-shell">

        {% include "partials/sidebar.html" %}
        <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" onclick="closeMobileSidebar()"></button>

        <main class="main-area">

            <div id="topbar">
                {% include "partials/topbar.html" %}
            </div>

            <div id="page-content" class="page-content">

                {% block content %}
                {% endblock %}

            </div>

        </main>

    </div>

    <div id="system-operation-overlay" class="system-operation-overlay" role="dialog" aria-modal="true" aria-labelledby="system-operation-title" hidden>
        <div class="system-operation-card">
            <div id="system-operation-spinner" class="system-operation-spinner" aria-hidden="true"></div>
            <i id="system-operation-failed-icon" class="fa-solid fa-circle-exclamation system-operation-failed-icon" hidden></i>
            <h2 id="system-operation-title">System operation in progress</h2>
            <p id="system-operation-message">Please wait. Do not close this page.</p>
            <div id="system-operation-progress" class="system-operation-progress"><span></span></div>
            <p id="system-operation-note" class="system-operation-note">The console is locked until this operation completes or fails.</p>
            <button id="system-operation-close" class="button" type="button" onclick="closeSystemOperation()" hidden>Return to console</button>
        </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="/static/app.js?v=20260809-17"></script>
</body>

</html>
