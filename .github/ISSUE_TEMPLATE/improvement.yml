name: Improvement
description: Something that already exists but should work, read, or behave differently.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Small changes are welcome and this is the right place for them. A
        confusing label, a unit that should be different, a default that's wrong,
        a value that's too coarse to be useful. If you noticed it, it's worth
        filing.

  - type: textarea
    id: current
    attributes:
      label: What does it do today?
      placeholder: The Overview uptime only changes after reloading the page.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: What should it do instead?
      placeholder: The uptime should update while the server is running.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does the current behavior get in the way?
      description: Skip this if it's obvious from the above.

  - type: dropdown
    id: implement
    attributes:
      label: Would you like to implement this?
      description: Either answer is fine.
      options:
        - I'm hoping someone else picks it up
        - I'd like to implement it myself
        - Not sure yet
    validations:
      required: true
